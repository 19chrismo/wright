[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wright"
version = "0.1.0"
description = "Local-first single-window AI agent that builds the thing, with integrity gates."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "segno>=1.6",          # QR code for pairing the owner's phone (pure Python, BSD)
    # cryptography 49 and 50 publish no Intel-Mac wheels (PyPI JSON API, checked 2026-11-25);
    # 48.0.1 is the newest with a universal2 wheel, so Intel Macs never need a Rust toolchain.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
test = ["pytest>=8", "jsonschema>=4.20"]

[project.scripts]
wright = "wright.cli:main"

[tool.setuptools.packages.find]
include = ["wright*"]

[tool.setuptools.package-data]
wright = ["ui/*", "prompts/*", "plans/*", "schemas/*", "seed/**/*"]

[tool.uv]
# The lock fails if any locked package lacks a prebuilt wheel for one of these machines
# (brief v3, section 12.2): the target Intel Mac, Apple-silicon Macs, and Linux CI.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
